server {
  listen 80;

  location /nimbleapi/ {
    resolver 127.0.0.11 valid=10s;
    set $backend backend:3200;
    proxy_pass http://$backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Bare prefix without trailing slash -> redirect so relative asset URLs resolve.
  location = /nimble-frontend {
    return 301 /nimble-frontend/;
  }

  location /nimble-frontend/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /nimble-frontend/index.html;
  }
}
