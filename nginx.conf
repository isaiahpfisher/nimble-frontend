server {
  listen 80;

  location /nimbleapi/ {
    resolver 127.0.0.11 valid=10s;
    set $backend backend:3200;
    proxy_pass http://$backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # nginx defaults to 60s, which the assistant routes can exceed: one chat
    # message is up to ASSISTANT_MAX_TURNS model round-trips, each firing
    # several internal tool calls, and a failed model call is retried 3x.
    # A 504 here is worse than a slow response -- the backend keeps running and
    # still commits any write tools, so the user retries and gets duplicates.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # Bare prefix without trailing slash -> redirect so relative asset URLs resolve.
  location = /nimble-frontend {
    return 301 /nimble-frontend/;
  }

  location /nimble-frontend/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /nimble-frontend/index.html;
  }
}
